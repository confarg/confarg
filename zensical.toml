[project]
copyright = """
Copyright &copy; 2026 The authors
"""
repo_url = "https://github.com/confarg/confarg"
site_author = "confarg"
site_description = "Documentation for confarg, a python library to load and resolve complex configurations from files, environment variables and command line arguments."
site_name = "confarg documentation"
site_url = "https://confarg.github.io/confarg/"

nav = [
  { "Get started" = "index.md" },
  { "Tutorials" = [
    "examples/README.md",
    { "1. Three input sources" = "examples/1_three_input_sources/README.md" },
    { "2. Input precedence" = "examples/2_input_precedence/README.md" },
    { "3. Scalar types" = "examples/3_scalar_types/README.md" },
    { "4. Leaf types" = "examples/4_leaf_types/README.md" },
    { "5. Generics" = "examples/5_generics/README.md" },
    { "6. Unions" = "examples/6_unions/README.md" },
  ] },
  { "Reference" = "reference.md" },
]

#

[project.theme]
favicon = "assets/favicon.svg"
features = [
  "content.code.annotate",       # https://zensical.org/docs/authoring/code-blocks/#code-annotations
  "content.code.copy",           # https://zensical.org/docs/authoring/code-blocks/#code-copy-button
  "content.code.select",         # https://zensical.org/docs/authoring/code-blocks/#code-selection-button
  "content.footnote.tooltips",   # https://zensical.org/docs/authoring/footnotes/#footnote-tooltips
  "content.tooltips",            # https://zensical.org/docs/authoring/tooltips/#improved-tooltips
  "navigation.expand",           # https://zensical.org/docs/setup/navigation/#navigation-expansion
  "navigation.footer",           # https://zensical.org/docs/setup/footer/#navigation
  "navigation.indexes",          # https://zensical.org/docs/setup/navigation/#section-index-pages
  "navigation.instant",          # https://zensical.org/docs/setup/navigation/#instant-navigation
  "navigation.instant.prefetch", # https://zensical.org/docs/setup/navigation/#instant-prefetching
  "navigation.path",             # https://zensical.org/docs/setup/navigation/#navigation-path
  "navigation.sections",         # https://zensical.org/docs/setup/navigation/#navigation-sections
  "navigation.top",              # https://zensical.org/docs/setup/navigation/#back-to-top-button
  "search.highlight",            # https://zensical.org/docs/setup/search/#search-highlighting
]
language = "en"
logo = "assets/logo.svg"

[project.theme.icon]
logo = "lucide/cog"
repo = "fontawesome/brands/git-alt"

[project.theme.font]
code = "Google Sans Code"
text = "Google Sans"

[[project.theme.palette]]
accent      = "pink"
media       = "(prefers-color-scheme: light)"
primary     = "pink"
scheme      = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
accent      = "pink"
media       = "(prefers-color-scheme: dark)"
primary     = "pink"
scheme      = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/confarg/confarg"

# https://zensical.org/docs/setup/extensions/
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.quotes]
callouts = true
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index     = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums     = true
line_spans          = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style     = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths       = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style            = "google"
inherited_members          = true
separate_signature         = true
show_root_heading          = true
show_signature_annotations = false
show_source                = false
show_symbol_type_heading   = true
show_symbol_type_toc       = true

[project.validation]
unresolved_references = false  # https://github.com/zensical/zensical/issues/700#issuecomment-4552385582
