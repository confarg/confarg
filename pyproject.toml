[project]
authors = [
    { name = "confarg", email = "280620574+confarg@users.noreply.github.com" },
]
description = "Load and resolve complex configurations from files, environment variables and command line arguments. Keep your favorite CLI library."
license = "MPL-2.0"
name = "confarg"
readme = "README.md"
requires-python = ">=3.12"
version = "0.0.1.dev4"

[project.urls]
Documentation = "https://confarg.github.io/confarg"
Repository    = "https://github.com/confarg/confarg"

[project.optional-dependencies]
completion = ["argcomplete>=3.0"]

[dependency-groups]
dev = [
    "click>=8.3.3",
    "cyclopts>=4.11.2",
    "hypothesis>=6.100",
    "ipython>=9.12.0",
    "jsonargparse>=4.48.0",
    "mkdocstrings-python>=2.0.3",
    "mkdocstrings>=1.0.4",
    "pre-commit>=4.5.1",
    "pytest-cov>=7.0.0",
    "pytest-markdown-docs>=0.9.2",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "typer>=0.25.1",
    "zensical>=0.0.41",
]

[build-system]
build-backend = "uv_build"
requires      = ["uv_build>=0.11.13,<0.12.0"]
