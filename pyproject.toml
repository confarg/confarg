[project]
authors = [
    { name = "confarg", email = "280620574+confarg@users.noreply.github.com" },
]
description = "Load and resolve complex configurations from files, environment variables and command line arguments. Keep your favorite CLI library."
license = "MPL-2.0"
name = "confarg"
readme = "README.md"
requires-python = ">=3.12"
version = "0.0.6"

[project.urls]
Documentation = "https://confarg.github.io/confarg"
Repository    = "https://github.com/confarg/confarg"

[project.optional-dependencies]
completion = ["argcomplete>=3.0"]
s3         = ["boto3>=1.34"]

[dependency-groups]
dev = [
    "boto3>=1.34",
    "click>=8.3.3",
    "confarg-example-configs",
    "cyclopts>=4.11.2",
    "hypothesis>=6.100",
    "ipython>=9.12.0",
    "jsonargparse>=4.48.0",
    "just>=0.8.165",
    "markdown-code-snippet==0.0.1.dev2",
    "mkdocstrings-python>=2.0.3",
    "mkdocstrings>=1.0.4",
    "pre-commit>=4.5.1",
    "pytest-cov>=7.0.0",
    "pytest-markdown-console>=0.0.1",
    "pytest-xdist>=3.8.0",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "ty>=0.0.39",
    "typer>=0.27",
    "zensical>=0.0.59",
]

[build-system]
build-backend = "uv_build"
requires      = ["uv_build>=0.11.13,<0.12.0"]

[tool.uv.workspace]
members = ["examples/configs"]

[tool.uv.sources]
confarg-example-configs = { workspace = true }

# The pytest defaults, plus `docs-dev`: internal documentation is never test material, and a
# board reproduction is meant to be read, not run
# (docs-dev/architecture/testing.md#examples-and-documentation).
[tool.pytest.ini_options]
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "docs-dev",
    "node_modules",
    "venv",
    "{arch}",
]
