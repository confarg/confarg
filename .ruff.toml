line-length    = 120
target-version = "py312"

[lint]
preview = true
explicit-preview-rules = true
ignore = [
    'ANN401', # any-type
    'COM812', # missing-trailing-comma — the formatter owns trailing commas; the rule's own doc says to disable it when one is in use (https://docs.astral.sh/ruff/rules/missing-trailing-comma/)
]
select = [
    "A",      # flake8-builtins
    "ANN",    # flake8-annotations
    "ARG",    # flake8-unused-arguments
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "C90",    # mccabe
    "COM",    # flake8-commas
    "D",      # pydocstyle
    "E",      # pycodestyle errors
    "EM",     # flake8-errmsg
    "F",      # pyflakes
    "FBT",    # flake8-boolean-trap
    "FURB",   # refurb
    "FURB118", # reimplemented-operator — a preview rule, opted in by name (docs-dev/architecture/design-decisions/lint-holds-the-line.md)
    "G",      # flake8-logging-format
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "ISC",    # flake8-implicit-str-concat
    "LOG",    # flake8-logging
    "PERF",   # Perflint
    "PIE",    # flake8-pie
    "PL",     # Pylint
    "PLW0717", # too-many-statements-in-try-clause — a preview rule, opted in by name (docs-dev/architecture/design-decisions/lint-holds-the-line.md)
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "SLOT",   # flake8-slots
    "TC",     # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "TRY",    # tryceratops
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit
    "UP",     # pyupgrade
]
[lint.per-file-ignores]
"examples/**" = [
    "D100", # undocumented-public-module
    "D101", # undocumented-public-class
    "D102", # undocumented-public-method
    "D103", # undocumented-public-function
    "D104", # undocumented-public-package
    "D105", # undocumented-magic-method
    "D106", # undocumented-public-nested-class
    "D107", # undocumented-public-init
]
"tests/**" = [
    "ANN",     # flake8-annotations
    "ARG",     # flake8-unused-arguments
    "PLR2004", # magic-value-comparison
    "S",       # flake8-bandit
    "UP007",   # non-pep604-annotation-union
    "UP045",   # non-pep604-annotation-optional
]

[lint.pydocstyle]
convention = "google"
